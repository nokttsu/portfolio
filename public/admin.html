<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфолио — CMS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191919; --side:#202020; --hover:rgba(255,255,255,.055); --hover2:rgba(255,255,255,.09);
  --text:rgba(255,255,255,.81); --dim:rgba(255,255,255,.443); --faint:rgba(255,255,255,.282);
  --line:rgba(255,255,255,.094); --panel:#252525; --blue:#2383e2; --blue-h:#1a6dbf;
  --shadow:0 0 0 1px rgba(15,15,15,.2),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text);background:none;border:none;width:100%;resize:none;outline:none}
::placeholder{color:var(--faint)}
#app{display:flex;height:100%}

/* ---------- sidebar ---------- */
.side{width:248px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:8px 0;user-select:none}
.ws{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:0 8px 8px;border-radius:4px;font-size:14px;font-weight:600}
.ws:hover{background:var(--hover)}
.ws .ava{width:20px;height:20px;border-radius:4px;background:#fff;color:#000;display:grid;place-items:center;font-size:11px;font-weight:700}
.ws .st{width:6px;height:6px;border-radius:50%;background:#eb5757;margin-left:auto}
.ws .st.ok{background:#4dab6d}
.sec{padding:14px 16px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.02em}
#nav{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
#nav::-webkit-scrollbar{width:8px}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:content-box}
.item .caret{width:16px;flex:none;text-align:center;font-size:9px;color:var(--faint);transition:transform .12s}
.item .caret.open{transform:rotate(90deg)}
.item{display:flex;align-items:center;gap:7px;height:28px;margin:0 8px;padding:0 8px;border-radius:4px;font-size:14px;color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden}
.item:hover{background:var(--hover);color:var(--text)}
.item.on{background:var(--hover2);color:var(--text);font-weight:500}
.item .ic{width:18px;text-align:center;font-size:14px;opacity:.75;flex:none}
.item .tw{width:14px;text-align:center;font-size:10px;color:var(--faint);flex:none}
.item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .add{opacity:0;font-size:15px;color:var(--faint);width:18px;text-align:center}
.item:hover .add{opacity:1}
.item.sub{padding-left:26px}
.grow{flex:1}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:45px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--dim);min-width:0}
.crumbs b{font-weight:500;color:var(--text)}
.crumbs .sep{color:var(--faint)}
.crumbs button{padding:3px 6px;border-radius:4px}
.crumbs button:hover{background:var(--hover)}
.seg{display:flex;background:rgba(255,255,255,.055);border-radius:6px;padding:2px}
.seg button{padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500;color:var(--dim)}
.seg button.on{background:#373737;color:var(--text)}
.pub{background:var(--blue);color:#fff;font-size:14px;font-weight:500;padding:5px 12px;border-radius:4px}
.pub:hover{background:var(--blue-h)}
.pub[disabled]{opacity:.5;cursor:default}
.pub.clean{background:transparent;color:var(--dim)}
.pub.clean:hover{background:var(--hover)}

.doc{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.doc::-webkit-scrollbar{width:10px}
.doc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.page{max-width:708px;margin:0 auto;padding:60px 60px 40vh}
.h1{font-size:40px;line-height:1.2;font-weight:700;color:#fff;margin-bottom:6px}
.sub{color:var(--faint);font-size:14px;margin-bottom:26px}

/* ---------- property rows (Notion database style) ---------- */
.props{display:flex;flex-direction:column;gap:1px;margin-bottom:26px}
.prop{display:flex;align-items:flex-start;gap:6px;border-radius:4px;padding:5px 6px;min-height:34px}
.prop:hover{background:var(--hover)}
.prop>.k{display:flex;align-items:center;gap:7px;width:168px;flex:none;color:var(--dim);font-size:14px;padding-top:3px}
.prop .mini,.prop button.del{flex:none}
.prop>.k .ic{opacity:.6;width:16px;text-align:center}
.prop>.v{flex:1;min-width:0;font-size:14px}
.prop .v input,.prop .v textarea{font-size:14px;padding:3px 4px;border-radius:4px}
.prop .v input:hover,.prop .v textarea:hover{background:var(--hover)}
.prop .v input:focus,.prop .v textarea:focus{background:var(--hover);box-shadow:inset 0 0 0 1px var(--blue)}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border-radius:4px;padding:2px 7px;font-size:13px;margin:2px 4px 2px 0}
.chip button{color:var(--faint);font-size:12px}
.chip button:hover{color:var(--text)}

/* ---------- blocks ---------- */
.blocks{display:flex;flex-direction:column}
.b{position:relative;padding:3px 2px;border-radius:3px}
.b.drag-over{box-shadow:0 -2px 0 var(--blue)}
.b.dragging{opacity:.35}
.gutter{position:absolute;left:-52px;top:2px;display:flex;gap:1px;opacity:0;transition:opacity .1s}
.b:hover>.gutter,.gutter:focus-within{opacity:1}
.gutter button{width:24px;height:24px;border-radius:4px;color:var(--faint);display:grid;place-items:center;font-size:15px}
.gutter button:hover{background:var(--hover2);color:var(--text)}
.b textarea,.b input{padding:3px 2px;border-radius:3px;line-height:1.5}
.b textarea:hover,.b input:hover{background:rgba(255,255,255,.03)}
.t-h1 textarea{font-size:30px;font-weight:600;color:#fff;line-height:1.3}
.t-h2 textarea{font-size:24px;font-weight:600;color:#fff;line-height:1.3}
.eyebrow input{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.t-quote{border-left:3px solid rgba(255,255,255,.85);padding-left:14px}
.t-quote textarea{font-size:17px}
.t-callout{background:rgba(255,255,255,.045);border-radius:4px;padding:14px 14px 14px 12px;display:flex;gap:9px}
.t-callout .emo{font-size:18px;line-height:1.4;cursor:pointer}
.li{display:flex;gap:8px;align-items:flex-start}
.li .bullet{color:var(--dim);line-height:1.55;user-select:none;flex:none;width:14px;text-align:center}
.li .del{opacity:0;color:var(--faint);font-size:12px;padding:0 4px}
.li:hover .del{opacity:1}
.imgbox{border-radius:4px;overflow:hidden;background:rgba(255,255,255,.03);position:relative;display:flex;justify-content:center;max-height:260px}
.imgbox img{max-width:100%;max-height:260px;display:block;object-fit:contain}
.imgbox .empty{width:100%;height:132px;display:grid;place-items:center;align-content:center;color:var(--faint);font-size:14px;gap:6px}
.grid2 .imgbox img{width:100%;aspect-ratio:16/9;object-fit:cover}
.imgtools{display:flex;gap:6px;margin-top:6px}
.cap input{font-size:13px;color:var(--dim);text-align:center}
.grid2{display:grid;gap:8px}
.mini{font-size:13px;color:var(--dim);padding:4px 8px;border-radius:4px;background:rgba(255,255,255,.055)}
.mini:hover{background:var(--hover2);color:var(--text)}
.mini.danger:hover{color:#ff7369}
.addblock{display:flex;align-items:center;gap:8px;height:32px;margin-top:6px;color:var(--faint);font-size:14px;border-radius:4px;padding:0 4px}
.addblock:hover{background:var(--hover);color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:60;width:320px;max-height:340px;overflow-y:auto;background:var(--panel);border-radius:6px;box-shadow:var(--shadow);padding:6px 4px;display:none}
.menu.on{display:block}
.menu .gh{padding:6px 10px 4px;font-size:11px;font-weight:600;color:var(--faint)}
.menu .mi{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;cursor:pointer}
.menu .mi:hover,.menu .mi.sel{background:var(--hover2)}
.menu .mi .mic{width:38px;height:38px;flex:none;border-radius:4px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:17px}
.menu .mi .mn{font-size:14px}
.menu .mi .md{font-size:12px;color:var(--faint)}
.menu.small{width:210px}
.menu.small .mi{gap:8px}
.menu.small .mi .mic{width:20px;height:20px;background:none;font-size:14px}

.bar{position:fixed;z-index:70;display:none;background:var(--panel);border-radius:5px;box-shadow:var(--shadow);padding:3px}
.bar.on{display:flex}
.bar button{padding:5px 9px;border-radius:4px;font-size:14px;color:var(--text)}
.bar button:hover{background:var(--hover2)}
.bar .sepv{width:1px;background:var(--line);margin:4px 2px}
.bar b{font-weight:700}.bar i{font-style:italic}
.bar .hl{background:rgba(255,255,255,.18);border-radius:3px;padding:0 4px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--panel);color:var(--text);padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);font-size:14px;opacity:0;transition:.18s;pointer-events:none;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{color:#ff7369}
.hint{color:var(--faint);font-size:13px;line-height:1.6}
a{color:#5e9ee8}
</style>
</head>
<body>
<div id="app">
  <div class="side">
    <div class="ws" id="ws"><span class="ava">V</span><span>Портфолио</span><span class="st" id="st"></span></div>
    <div class="sec">Страницы</div>
    <div id="nav"></div>
    <div class="item" data-p="settings" style="margin-top:6px"><span class="ic">⚙</span><span class="lbl">Настройки</span></div>
    <a class="item" href="./" target="_blank"><span class="ic">↗</span><span class="lbl">Открыть сайт</span></a>
  </div>

  <div class="main">
    <div class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="grow"></div>
      <div class="seg" id="seg"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
      <button class="pub clean" id="pub">Опубликовано</button>
    </div>
    <div class="doc"><div class="page" id="page"></div></div>
  </div>
</div>

<div class="menu" id="slash"></div>
<div class="menu small" id="ctx"></div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>

<script>
const REPO="nokttsu/portfolio", BRANCH="main";
let C=null, L=localStorage.getItem("cms-lang")||"ru", P="site", CASE=null, dirty=false, casesOpen=false;

const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild};
const token=()=>localStorage.getItem("gh-token")||"";
const toast=(m,t)=>{const e=$("#toast");e.textContent=m;e.className="toast on"+(t==="err"?" err":"");setTimeout(()=>e.className="toast",2400)};
// content paths are site-absolute ("/img/x.png") but the admin lives at
// /<repo>/admin.html — resolve them relative to this page instead
const src=p=>!p?"":/^(https?:|data:)/.test(p)?p:"."+(p.startsWith("/")?p:"/"+p);
const mark=()=>{dirty=true;const b=$("#pub");b.textContent="Опубликовать";b.classList.remove("clean")};
const bi=()=>({en:"",ru:""});

async function api(path,opts={}){
  const headers={Accept:"application/vnd.github+json",...(opts.headers||{})};
  if(token())headers.Authorization="Bearer "+token();
  const r=await fetch("https://api.github.com/repos/"+REPO+"/"+path,{...opts,headers});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function upload(file){
  if(!token())throw new Error("no token");
  const buf=await file.arrayBuffer();let s="";const b=new Uint8Array(buf);
  for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  const safe=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"");
  await api("contents/public/img/uploads/"+safe,{method:"PUT",body:JSON.stringify({message:"cms: upload "+safe,content:btoa(s),branch:BRANCH})});
  return "/img/uploads/"+safe;
}

/* ---------- editable primitives ---------- */
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function area(get,set,ph,cls){
  const t=el(`<textarea rows="1" placeholder="${ph||""}"></textarea>`);
  if(cls)t.className=cls;
  t.value=get()||"";
  requestAnimationFrame(()=>grow(t));
  t.addEventListener("input",()=>{set(t.value);grow(t);mark()});
  t.addEventListener("focus",()=>activeArea=t);
  t.addEventListener("keydown",e=>slashKey(e,t));
  return t;
}
function line(get,set,ph,cls){
  const i=el(`<input placeholder="${ph||""}">`);
  if(cls)i.className=cls;
  i.value=get()||"";
  i.addEventListener("input",()=>{set(i.value);mark()});
  return i;
}
// bilingual helpers
const bget=o=>k=>{const v=o[k];return v&&typeof v==="object"?(v[L]||""):(v||"")};
const bset=o=>k=>v=>{if(o[k]==null||typeof o[k]==="string")o[k]={en:o[k]||"",ru:o[k]||""};o[k][L]=v};
const bArea=(o,k,ph)=>area(()=>bget(o)(k),bset(o)(k),ph);
const bLine=(o,k,ph,cls)=>line(()=>bget(o)(k),bset(o)(k),ph,cls);

function prop(icon,label,node){
  const r=el(`<div class="prop"><div class="k"><span class="ic">${icon}</span><span>${label}</span></div><div class="v"></div></div>`);
  $(".v",r).append(node);return r;
}
function imageField(obj,key,label){
  const wrap=el(`<div></div>`);
  const draw=()=>{
    wrap.innerHTML="";
    const box=el(`<div class="imgbox"></div>`);
    if(obj[key])box.append(el(`<img src="${src(obj[key])}" alt="">`));
    else box.append(el(`<div class="empty"><span>🖼</span><span>${label||"Нет изображения"}</span></div>`));
    const tools=el(`<div class="imgtools"></div>`);
    const up=el(`<button class="mini">Загрузить</button>`);
    up.onclick=()=>{
      const i=document.createElement("input");i.type="file";i.accept="image/*,video/*";
      i.onchange=async()=>{const f=i.files[0];if(!f)return;toast("Загрузка…");
        try{obj[key]=await upload(f);mark();draw();toast("Загружено")}catch(e){toast("Нужен токен или нет прав","err")}};
      i.click();
    };
    const path=line(()=>obj[key],v=>obj[key]=v,"/img/...");
    path.style.fontSize="13px";
    tools.append(up);
    wrap.append(box,tools,prop("🔗","Путь",path));
    $(".prop",wrap).style.marginTop="2px";
  };
  draw();return wrap;
}

/* ---------- slash menu + inline toolbar ---------- */
let activeArea=null, slashCtx=null, slashSel=0;
const BLOCKS=[
  ["section","Раздел","H1 · крупный заголовок раздела","H1"],
  ["subheading","Подзаголовок","H2 · заголовок внутри раздела","H2"],
  ["paragraph","Текст","Обычный абзац","¶"],
  ["list","Список","Маркированный список с подводкой","•"],
  ["quote","Цитата","Выделенная цитата с автором","❝"],
  ["callout","Выноска","Блок с иконкой и акцентом","💡"],
  ["metrics","Метрики","Карточки с цифрами","📊"],
  ["image","Картинка","Изображение с подписью","🖼"],
  ["gallery","Галерея","Несколько картинок в ряд","▦"],
  ["columns","Две колонки","Два текста рядом","▥"],
];
function newBlock(k){
  switch(k){
    case "section":return{type:"section",name:bi(),title:bi()};
    case "subheading":return{type:"subheading",text:bi()};
    case "paragraph":return{type:"paragraph",text:bi()};
    case "list":return{type:"list",title:bi(),items:[bi()]};
    case "quote":return{type:"quote",text:bi(),author:bi(),href:"#"};
    case "callout":return{type:"callout",icon:"💡",text:bi()};
    case "metrics":return{type:"metrics",items:[{value:bi(),label:bi()}]};
    case "image":return{type:"image",src:"",size:"wide",caption:bi()};
    case "gallery":return{type:"gallery",columns:2,images:[],caption:bi()};
    case "columns":return{type:"columns",left:bi(),right:bi()};
  }
}
function openSlash(ta,onPick){
  const m=$("#slash");slashSel=0;
  const r=ta.getBoundingClientRect();
  m.innerHTML=`<div class="gh">Блоки</div>`;
  BLOCKS.forEach(([k,n,d,ic],i)=>{
    const it=el(`<div class="mi${i===0?" sel":""}"><div class="mic">${ic}</div><div><div class="mn">${n}</div><div class="md">${d}</div></div></div>`);
    it.onmousedown=e=>{e.preventDefault();onPick(k);closeMenus()};
    m.append(it);
  });
  m.style.left=Math.min(r.left,innerWidth-340)+"px";
  m.style.top=Math.min(r.bottom+6,innerHeight-350)+"px";
  m.classList.add("on");slashCtx={ta,onPick};
}
function slashKey(e,ta){
  const m=$("#slash");
  if(m.classList.contains("on")){
    const items=[...m.querySelectorAll(".mi")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      items[slashSel]?.classList.remove("sel");
      slashSel=(slashSel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;
      items[slashSel].classList.add("sel");items[slashSel].scrollIntoView({block:"nearest"});return;
    }
    if(e.key==="Enter"){e.preventDefault();items[slashSel].dispatchEvent(new MouseEvent("mousedown"));return}
    if(e.key==="Escape"){closeMenus();return}
  }
  if(e.key==="/"&&ta.value.trim()===""&&slashCtx?.ta!==ta&&ta.dataset.slash==="1"){
    setTimeout(()=>openSlash(ta,k=>{ta.value="";ta.dispatchEvent(new Event("input"));ta.dataset.insert&&window.__insert(ta.dataset.insert,k)}),0);
  }
}
function closeMenus(){$("#slash").classList.remove("on");$("#ctx").classList.remove("on");slashCtx=null}
document.addEventListener("mousedown",e=>{if(!e.target.closest(".menu"))closeMenus()});

// inline formatting toolbar over a textarea selection
function wrapSel(ta,a,b){
  const s=ta.selectionStart,e=ta.selectionEnd;if(s===e)return;
  const v=ta.value,sel=v.slice(s,e);
  ta.value=v.slice(0,s)+a+sel+(b||a)+v.slice(e);
  ta.dispatchEvent(new Event("input"));
  ta.focus();ta.setSelectionRange(s+a.length,e+a.length);
}
(function initBar(){
  const bar=$("#bar");
  const mk=(html,fn,title)=>{const b=el(`<button title="${title}">${html}</button>`);b.onmousedown=e=>{e.preventDefault();fn()};return b};
  bar.append(
    mk("<b>B</b>",()=>wrapSel(activeArea,"**"),"Жирный"),
    mk("<i>I</i>",()=>wrapSel(activeArea,"*"),"Курсив"),
    mk('<span class="hl">A</span>',()=>wrapSel(activeArea,"=="),"Выделение"),
    el(`<div class="sepv"></div>`),
    mk("✕",()=>{const t=activeArea;if(!t)return;const s=t.selectionStart,e=t.selectionEnd;
      t.value=t.value.slice(0,s)+t.value.slice(s,e).replace(/\*\*|==|\*/g,"")+t.value.slice(e);
      t.dispatchEvent(new Event("input"))},"Убрать форматирование")
  );
  const upd=()=>{
    const t=document.activeElement;
    if(!(t&&t.tagName==="TEXTAREA")||t.selectionStart===t.selectionEnd){bar.classList.remove("on");return}
    activeArea=t;
    const r=t.getBoundingClientRect();
    bar.style.left=Math.max(8,Math.min(r.left+20,innerWidth-200))+"px";
    bar.style.top=(r.top-42)+"px";
    bar.classList.add("on");
  };
  document.addEventListener("selectionchange",upd);
  document.addEventListener("scroll",()=>bar.classList.remove("on"),true);
})();

/* ---------- block rendering (case document) ---------- */
function blockNode(list,i,redraw){
  const b=list[i];
  const kind=BLOCKS.find(x=>x[0]===b.type);
  const node=el(`<div class="b t-${b.type}"></div>`);
  const gut=el(`<div class="gutter"></div>`);
  const add=el(`<button title="Добавить ниже">＋</button>`);
  const hnd=el(`<button title="Перетащить · меню">⠿</button>`);
  add.onclick=()=>{const r=add.getBoundingClientRect();
    openSlashAt(r,k=>{list.splice(i+1,0,newBlock(k));mark();redraw()})};
  hnd.onclick=()=>{const r=hnd.getBoundingClientRect();ctxMenu(r,list,i,redraw)};
  gut.append(add,hnd);node.append(gut);

  // drag & drop reorder
  node.draggable=true;
  node.addEventListener("dragstart",e=>{e.dataTransfer.setData("i",i);node.classList.add("dragging")});
  node.addEventListener("dragend",()=>node.classList.remove("dragging"));

function caseDoc(cs){

  out.push(el(`<div class="sub" style="margin:26px 0 6px">Мета</div>`));

  out.push(del);

    it.onclick=()=>{P=k;CASE=null;draw()};
    if(k==="works"){
      const cr=$(".caret",it);

});
$("#pub").onclick=async()=>{
  if(!dirty){toast("Нет изменений");return}
  if(!token()){P="settings";CASE=null;draw();toast("Сначала добавь токен","err");return}
  const b=$("#pub");b.disabled=true;b.textContent="Публикую…";
  try{
    const cur=await api("contents/public/content.json?ref="+BRANCH).catch(()=>null);
    await api("contents/public/content.json",{method:"PUT",body:JSON.stringify({
      message:"cms: update content",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(C,null,2)))),
      branch:BRANCH,...(cur?.sha?{sha:cur.sha}:{})
    })});
    dirty=false;b.textContent="Опубликовано";b.classList.add("clean");
    toast("Опубликовано · сборка займёт ~минуту");
  }catch(e){toast("Ошибка публикации","err");console.error(e);b.textContent="Опубликовать"}
  b.disabled=false;
};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

(async function init(){
  document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x.dataset.l===L));
  $("#st").className="st"+(token()?" ok":"");
  try{C=await(await fetch("./content.json?"+Date.now())).json()}
  catch(e){toast("Не удалось загрузить content.json","err");C=null}
  draw();
})();
</script>
