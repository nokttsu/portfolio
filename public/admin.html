<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS — портфолио</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--line:#232323;--text:#ededed;--dim:#8a8a8a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 13px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:#3d3d3d}
textarea{min-height:76px;resize:vertical}
#app{display:flex;height:100%}
.side{width:210px;flex-shrink:0;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:3px}
.brand{font-weight:600;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.gray{background:#555}
.navbtn{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;color:var(--dim);font-weight:500}
.navbtn:hover{background:var(--panel);color:var(--text)}
.navbtn.active{background:var(--panel2);color:var(--text)}
.spacer{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
.crumb{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.grow{flex:1}
.langsw{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.langsw button{padding:4px 12px;border-radius:6px;color:var(--dim);font-size:12px;font-weight:600}
.langsw button.on{background:var(--panel2);color:var(--text)}
#publish{background:var(--panel2);color:var(--dim);font-weight:600;padding:8px 16px;border-radius:8px}
#publish.dirty{background:#fff;color:#000}
.view{flex:1;overflow-y:auto;padding:24px 20px 100px}
.inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:13px;font-weight:600}
.f{display:flex;flex-direction:column;gap:6px}
.f>span{color:var(--dim);font-size:12px;font-weight:500}
.row{display:flex;gap:10px}.row>*{flex:1}
.rec{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.rec:hover{border-color:#333}
.rec img{width:56px;height:32px;object-fit:cover;border-radius:5px;background:#222;flex-shrink:0}
.rec .t{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .m{color:var(--dim);font-size:11px;font-family:"IBM Plex Mono",monospace}
.mini{padding:6px 12px;border-radius:8px;background:var(--panel2);color:var(--dim);font-weight:500}
.mini:hover{color:var(--text)}
.mini.danger:hover{color:#f87171}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.blk .bh{display:flex;align-items:center;gap:8px}
.blk .bt{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;flex:1}
.addbar{display:flex;flex-wrap:wrap;gap:6px}
.addbar button{padding:6px 10px;border-radius:8px;background:var(--panel2);color:var(--dim);font-size:12px}
.addbar button:hover{color:var(--text)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.toast.err{background:#f87171;color:#fff}
.hint{color:var(--dim);font-size:12px}
a{color:#7dd3fc}
</style>
</head>
<body>
<div id="app">
  <div class="side">
    <div class="brand"><span class="dot gray" id="dot"></span><span>CMS</span></div>
    <button class="navbtn" data-v="site">Сайт и шапка</button>
    <button class="navbtn" data-v="hero">Главный экран</button>
    <button class="navbtn" data-v="experience">Опыт</button>
    <button class="navbtn" data-v="works">Работы</button>
    <button class="navbtn" data-v="about">Обо мне</button>
    <button class="navbtn" data-v="footer">Подвал</button>
    <button class="navbtn" data-v="ui">Кнопки и подписи</button>
    <div class="spacer"></div>
    <button class="navbtn" data-v="settings">Настройки</button>
    <a class="navbtn" href="./" target="_blank">Открыть сайт ↗</a>
  </div>
  <div class="main">
    <div class="top">
      <div class="crumb"><button class="mini" id="back" style="display:none">←</button><span id="title">Сайт</span></div>
      <div class="grow"></div>
      <div class="langsw"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
      <button id="publish">Опубликовать</button>
    </div>
    <div class="view"><div class="inner" id="view"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const REPO = "nokttsu/portfolio", BRANCH = "main";
let C = null, L = localStorage.getItem("cms-lang") || "ru", V = "site", dirty = false, editing = null;

const $ = (s, r = document) => r.querySelector(s);
const token = () => localStorage.getItem("gh-token") || "";
const toast = (m, t) => { const el = $("#toast"); el.textContent = m; el.className = "toast on" + (t === "err" ? " err" : ""); setTimeout(() => el.className = "toast", 2200) };
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild };
const mark = () => { dirty = true; $("#publish").classList.add("dirty") };

async function api(path, opts = {}) {
  const headers = { Accept: "application/vnd.github+json", ...(opts.headers || {}) };
  if (token()) headers.Authorization = "Bearer " + token();
  const r = await fetch("https://api.github.com/repos/" + REPO + "/" + path, { ...opts, headers });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------- field helpers (bilingual {en,ru} or plain) ---------- */
function fText(label, obj, key, multi) {
  const f = el(`<label class="f"><span>${label}</span>${multi ? "<textarea></textarea>" : "<input>"}</label>`);
  const i = f.querySelector("input,textarea");
  const val = obj[key];
  const bi = val && typeof val === "object";
  i.value = bi ? (val[L] ?? "") : (val ?? "");
  i.addEventListener("input", () => {
    if (bi || (obj[key] && typeof obj[key] === "object")) {
      obj[key] = { ...(obj[key] || {}), [L]: i.value };
    } else obj[key] = i.value;
    mark();
  });
  return f;
}
function fBiText(label, obj, key, multi) {
  if (obj[key] == null || typeof obj[key] === "string") obj[key] = { en: obj[key] || "", ru: obj[key] || "" };
  return fText(label + " · " + L.toUpperCase(), obj, key, multi);
}
function fImage(label, obj, key) {
  const f = el(`<label class="f"><span>${label}</span><div class="row"><input><button class="mini">Загрузить</button></div></label>`);
  const i = f.querySelector("input"), b = f.querySelector("button");
  i.value = obj[key] || "";
  i.addEventListener("input", () => { obj[key] = i.value; mark() });
  b.addEventListener("click", async (e) => {
    e.preventDefault();
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*,video/*";
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      try { const p = await upload(file); obj[key] = p; i.value = p; mark(); toast("Загружено") }
      catch (err) { toast("Ошибка загрузки", "err") }
    };
    inp.click();
  });
  return f;
}
async function upload(file) {
  if (!token()) throw new Error("нужен токен");
  const buf = await file.arrayBuffer();
  let bin = ""; const b = new Uint8Array(buf);
  for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  const safe = Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g, "");
  const path = "public/img/uploads/" + safe;
  await api("contents/" + path, { method: "PUT", body: JSON.stringify({ message: "cms: upload " + safe, content: btoa(bin), branch: BRANCH }) });
  return "/img/uploads/" + safe;
}
function listEditor(arr, render, add, label) {
  const wrap = el(`<div class="f"><span>${label}</span><div class="rowlist"></div></div>`);
  const list = wrap.querySelector(".rowlist");
  const draw = () => {
    list.innerHTML = "";
    arr.forEach((item, i) => {
      const row = el(`<div class="blk"></div>`);
      const head = el(`<div class="bh"><div class="bt">${i + 1}</div></div>`);
      const up = el(`<button class="mini">↑</button>`), dn = el(`<button class="mini">↓</button>`), rm = el(`<button class="mini danger">Удалить</button>`);
      up.onclick = () => { if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; mark(); draw() } };
      dn.onclick = () => { if (i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; mark(); draw() } };
      rm.onclick = () => { arr.splice(i, 1); mark(); draw() };
      head.append(up, dn, rm); row.append(head);
      render(item, row, draw);
      list.append(row);
    });
    const bar = el(`<div class="addbar"></div>`);
    const b = el(`<button>+ Добавить</button>`); b.onclick = () => { arr.push(add()); mark(); draw() };
    bar.append(b); list.append(bar);
  };
  draw();
  return wrap;
}

/* ---------- views ---------- */
const views = {
  site: () => {
    const s = C.site, out = [];
    const c1 = el(`<div class="card"><h3>Контакты</h3></div>`);
    c1.append(fText("Имя", s, "name"), fImage("Аватар", s, "avatar"), fText("Email", s, "email"),
      fText("Ссылка на резюме", s, "cvUrl"), fText("Telegram", s, "telegram"));
    out.push(c1);
    const c2 = el(`<div class="card"><h3>Ссылки в меню</h3></div>`);
    c2.append(listEditor(s.links, (it, row) => { row.append(fText("Название", it, "label"), fText("URL", it, "href")) },
      () => ({ label: "Link", href: "#" }), "Пункты"));
    out.push(c2);
    return out;
  },
  hero: () => {
    const h = C.hero, out = [];
    const c = el(`<div class="card"><h3>Главный экран</h3></div>`);
    c.append(fBiText("Заголовок", h, "title", true), fBiText("Описание", h, "intro", true),
      fImage("Видео", h, "video"), fImage("Постер (кадр)", h, "poster"));
    out.push(c);
    const n = el(`<div class="card"><h3>Нижняя навигация</h3></div>`);
    n.append(fBiText("Опыт", h.nav, "experience"), fBiText("Работы", h.nav, "works"), fBiText("Обо мне", h.nav, "about"));
    out.push(n);
    return out;
  },
  experience: () => {
    const e = C.experience, out = [];
    const c = el(`<div class="card"><h3>Секция</h3></div>`);
    c.append(fBiText("Заголовок", e, "heading"), fBiText("Текст под карточками", e, "text", true));
    out.push(c);
    const l = el(`<div class="card"><h3>Карточки</h3></div>`);
    l.append(listEditor(e.items, (it, row) => {
      if (it.divider) { row.append(el(`<div class="hint">Разделительная линия</div>`)); return }
      row.append(fBiText("Компания", it, "company"), fBiText("Роль", it, "role"), fBiText("Период", it, "meta"), fImage("Логотип", it, "logo"));
      const opts = el(`<div class="row"></div>`);
      const hi = el(`<label class="f"><span>Подсветить</span><select><option value="">нет</option><option value="1">да</option></select></label>`);
      hi.querySelector("select").value = it.highlight ? "1" : "";
      hi.querySelector("select").onchange = (ev) => { it.highlight = !!ev.target.value; mark() };
      const rd = el(`<label class="f"><span>Круглый логотип</span><select><option value="">нет</option><option value="1">да</option></select></label>`);
      rd.querySelector("select").value = it.round ? "1" : "";
      rd.querySelector("select").onchange = (ev) => { it.round = !!ev.target.value; mark() };
      opts.append(hi, rd); row.append(opts);
    }, () => ({ company: { en: "", ru: "" }, role: { en: "", ru: "" }, meta: { en: "", ru: "" }, logo: "" }), "Список"));
    const dv = el(`<div class="addbar"><button>+ Разделитель</button></div>`);
    dv.querySelector("button").onclick = () => { e.items.push({ divider: true }); mark(); render() };
    l.append(dv);
    out.push(l);
    return out;
  },
  works: () => {
    if (editing != null) return caseEditor(C.cases[editing]);
    const out = [];
    const c = el(`<div class="card"><h3>Секция</h3></div>`);
    c.append(fBiText("Заголовок", C.works, "heading"));
    const st = el(`<label class="f"><span>Показывать по</span><input type="number" min="1"></label>`);
    st.querySelector("input").value = C.works.step || 4;
    st.querySelector("input").oninput = (ev) => { C.works.step = +ev.target.value || 4; mark() };
    c.append(st); out.push(c);

    const l = el(`<div class="card"><h3>Кейсы</h3></div>`);
    const list = el(`<div class="rowlist" style="display:flex;flex-direction:column;gap:6px"></div>`);
    C.cases.forEach((cs, i) => {
      const r = el(`<div class="rec"><img src="${cs.cover || ""}" alt=""><div class="t">${cs.title || "—"}</div><div class="m">${(cs.blocks || []).length} блоков</div></div>`);
      r.onclick = () => { editing = i; render() };
      list.append(r);
    });
    const add = el(`<div class="addbar"><button>+ Новый кейс</button></div>`);
    add.querySelector("button").onclick = () => {
      C.cases.push({ id: "case-" + Date.now(), title: "Новый кейс", cover: "", metrics: [], intro: { en: "", ru: "" }, cta: { label: { en: "Visit live site", ru: "Открыть сайт" }, href: "#" }, meta: [], blocks: [] });
      mark(); editing = C.cases.length - 1; render();
    };
    l.append(list, add); out.push(l);
    return out;
  },
  about: () => {
    const a = C.about, out = [];
    const c = el(`<div class="card"><h3>Тексты</h3></div>`);
    c.append(fBiText("Заголовок", a, "heading"), fBiText("Абзац 1", a, "p1", true), fBiText("Абзац 2", a, "p2", true), fBiText("Абзац 3", a, "p3", true));
    out.push(c);
    const p = el(`<div class="card"><h3>Фото в колесе</h3><div class="hint">Вертикальные фото ставь «высокое» — они идут в плитки 3:4.</div></div>`);
    p.append(listEditor(a.photos, (it, row) => {
      row.append(fImage("Фото", it, "src"));
      const t = el(`<label class="f"><span>Формат</span><select><option value="">4:3 (горизонтальное)</option><option value="1">3:4 (высокое)</option></select></label>`);
      t.querySelector("select").value = it.tall ? "1" : "";
      t.querySelector("select").onchange = (ev) => { it.tall = !!ev.target.value; mark() };
      row.append(t);
    }, () => ({ src: "", tall: false }), "Фотографии"));
    out.push(p);
    return out;
  },
  footer: () => {
    const c = el(`<div class="card"><h3>Подвал</h3></div>`);
    c.append(fBiText("Слева", C.footer, "made"), fBiText("Справа", C.footer, "location"));
    return [c];
  },
  ui: () => {
    const c = el(`<div class="card"><h3>Кнопки и подписи</h3></div>`);
    Object.keys(C.ui).forEach((k) => c.append(fBiText(k, C.ui, k)));
    return [c];
  },
  settings: () => {
    const c = el(`<div class="card"><h3>GitHub</h3><div class="hint">Токен хранится только в этом браузере. Нужен доступ Contents: Read and write к репозиторию ${REPO}. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">Создать токен ↗</a></div></div>`);
    const f = el(`<label class="f"><span>Токен</span><input type="password" autocomplete="off"></label>`);
    const i = f.querySelector("input"); i.value = token();
    i.oninput = () => { localStorage.setItem("gh-token", i.value.trim()); $("#dot").className = "dot" + (i.value.trim() ? "" : " gray") };
    const out = el(`<button class="mini danger">Выйти (удалить токен)</button>`);
    out.onclick = () => { localStorage.removeItem("gh-token"); location.reload() };
    c.append(f, out);
    return [c];
  },
};

/* ---------- case editor (Notion-like blocks) ---------- */
const BLOCK_KINDS = [
  ["section", "Раздел"], ["subheading", "Подзаголовок"], ["paragraph", "Абзац"],
  ["list", "Список"], ["quote", "Цитата"], ["callout", "Выноска"],
  ["metrics", "Метрики"], ["image", "Картинка"], ["gallery", "Галерея"], ["columns", "Две колонки"],
];
const newBlock = (kind) => {
  const bi = () => ({ en: "", ru: "" });
  switch (kind) {
    case "section": return { type: "section", name: bi(), title: bi() };
    case "subheading": return { type: "subheading", text: bi() };
    case "paragraph": return { type: "paragraph", text: bi() };
    case "list": return { type: "list", title: bi(), items: [bi()] };
    case "quote": return { type: "quote", text: bi(), author: bi(), href: "#" };
    case "callout": return { type: "callout", icon: "⚡", text: bi() };
    case "metrics": return { type: "metrics", items: [{ value: bi(), label: bi() }] };
    case "image": return { type: "image", src: "", size: "wide", caption: bi() };
    case "gallery": return { type: "gallery", columns: 2, images: [], caption: bi() };
    case "columns": return { type: "columns", left: bi(), right: bi() };
  }
};

function caseEditor(cs) {
  const out = [];
  const c = el(`<div class="card"><h3>Кейс</h3></div>`);
  c.append(fText("Название", cs, "title"), fImage("Обложка", cs, "cover"), fBiText("Описание (под заголовком)", cs, "intro", true));
  const m = el(`<label class="f"><span>Метрики через запятую (AWARD, +20% CTR)</span><input></label>`);
  m.querySelector("input").value = (cs.metrics || []).join(", ");
  m.querySelector("input").oninput = (ev) => { cs.metrics = ev.target.value.split(",").map(s => s.trim()).filter(Boolean); mark() };
  c.append(m);
  const cta = el(`<div class="row"></div>`);
  cta.append(fBiText("Кнопка", cs.cta, "label"), fText("Ссылка кнопки", cs.cta, "href"));
  c.append(cta);
  out.push(c);

  const mt = el(`<div class="card"><h3>Мета (роль, сроки, платформа)</h3></div>`);
  mt.append(listEditor(cs.meta, (it, row) => { row.append(fBiText("Название", it, "k"), fBiText("Значение", it, "v")) },
    () => ({ k: { en: "", ru: "" }, v: { en: "", ru: "" } }), "Поля"));
  out.push(mt);

  const bl = el(`<div class="card"><h3>Содержание</h3></div>`);
  bl.append(listEditor(cs.blocks, (b, row) => {
    row.querySelector(".bt").textContent = (BLOCK_KINDS.find(k => k[0] === b.type) || [, b.type])[1];
    if (b.type === "section") row.append(fBiText("Подпись раздела", b, "name"), fBiText("Заголовок", b, "title", true));
    if (b.type === "subheading") row.append(fBiText("Текст", b, "text"));
    if (b.type === "paragraph") row.append(fBiText("Текст (**жирный**, *курсив*, ==выделение==)", b, "text", true));
    if (b.type === "callout") row.append(fText("Иконка", b, "icon"), fBiText("Текст", b, "text", true));
    if (b.type === "quote") row.append(fBiText("Цитата", b, "text", true), fBiText("Автор", b, "author"), fText("Ссылка", b, "href"));
    if (b.type === "columns") row.append(fBiText("Левая колонка", b, "left", true), fBiText("Правая колонка", b, "right", true));
    if (b.type === "list") {
      row.append(fBiText("Вводная строка", b, "title"));
      row.append(listEditor(b.items, (it, r2) => {
        const holder = { v: it };
        r2.append(fBiText("Пункт", holder, "v", true));
        // keep the array reference in sync
        const inp = r2.querySelector("input,textarea");
        inp.addEventListener("input", () => { b.items[b.items.indexOf(it)] = holder.v });
      }, () => ({ en: "", ru: "" }), "Пункты"));
    }
    if (b.type === "metrics") {
      row.append(listEditor(b.items, (it, r2) => { r2.append(fBiText("Значение", it, "value"), fBiText("Подпись", it, "label")) },
        () => ({ value: { en: "", ru: "" }, label: { en: "", ru: "" } }), "Метрики"));
    }
    if (b.type === "image") {
      row.append(fImage("Картинка", b, "src"), fBiText("Подпись", b, "caption"));
      const sz = el(`<label class="f"><span>Ширина</span><select><option value="wide">по сетке</option><option value="full">во всю колонку</option></select></label>`);
      sz.querySelector("select").value = b.size || "wide";
      sz.querySelector("select").onchange = (ev) => { b.size = ev.target.value; mark() };
      row.append(sz);
    }
    if (b.type === "gallery") {
      const g = el(`<label class="f"><span>Пути к картинкам, по одному в строке</span><textarea></textarea></label>`);
      g.querySelector("textarea").value = (b.images || []).join("\n");
      g.querySelector("textarea").oninput = (ev) => { b.images = ev.target.value.split("\n").map(s => s.trim()).filter(Boolean); mark() };
      const cols = el(`<label class="f"><span>Колонок</span><input type="number" min="1" max="4"></label>`);
      cols.querySelector("input").value = b.columns || 2;
      cols.querySelector("input").oninput = (ev) => { b.columns = +ev.target.value || 2; mark() };
      row.append(g, cols, fBiText("Подпись", b, "caption"));
    }
  }, () => newBlock("paragraph"), "Блоки"));

  const bar = el(`<div class="addbar"></div>`);
  BLOCK_KINDS.forEach(([k, name]) => {
    const b = el(`<button>+ ${name}</button>`);
    b.onclick = () => { cs.blocks.push(newBlock(k)); mark(); render() };
    bar.append(b);
  });
  bl.append(bar);
  out.push(bl);

  const del = el(`<div class="card"></div>`);
  const db = el(`<button class="mini danger">Удалить кейс</button>`);
  db.onclick = () => { if (confirm("Удалить кейс?")) { C.cases.splice(editing, 1); editing = null; mark(); render() } };
  del.append(db); out.push(del);
  return out;
}

/* ---------- shell ---------- */
function render() {
  $("#view").innerHTML = "";
  const titles = { site: "Сайт и шапка", hero: "Главный экран", experience: "Опыт", works: editing != null ? "Кейс" : "Работы", about: "Обо мне", footer: "Подвал", ui: "Кнопки и подписи", settings: "Настройки" };
  $("#title").textContent = titles[V] || V;
  $("#back").style.display = (V === "works" && editing != null) ? "" : "none";
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.v === V));
  if (!C) { $("#view").append(el(`<div class="card">Загрузка…</div>`)); return }
  (views[V]() || []).forEach(n => $("#view").append(n));
}

$("#back").onclick = () => { editing = null; render() };
document.querySelectorAll(".navbtn[data-v]").forEach(b => b.onclick = () => { V = b.dataset.v; editing = null; render() });
document.querySelectorAll(".langsw button").forEach(b => b.onclick = () => {
  L = b.dataset.l; localStorage.setItem("cms-lang", L);
  document.querySelectorAll(".langsw button").forEach(x => x.classList.toggle("on", x.dataset.l === L));
  render();
});

$("#publish").onclick = async () => {
  if (!token()) { toast("Нужен токен — вкладка Настройки", "err"); return }
  $("#publish").disabled = true;
  try {
    const cur = await api("contents/public/content.json?ref=" + BRANCH).catch(() => null);
    const body = {
      message: "cms: update content",
      content: btoa(unescape(encodeURIComponent(JSON.stringify(C, null, 2)))),
      branch: BRANCH,
      ...(cur && cur.sha ? { sha: cur.sha } : {}),
    };
    await api("contents/public/content.json", { method: "PUT", body: JSON.stringify(body) });
    dirty = false; $("#publish").classList.remove("dirty");
    toast("Опубликовано — сборка займёт ~минуту");
  } catch (e) { toast("Ошибка публикации", "err"); console.error(e) }
  $("#publish").disabled = false;
};

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = "" } });

(async function init() {
  document.querySelectorAll(".langsw button").forEach(x => x.classList.toggle("on", x.dataset.l === L));
  $("#dot").className = "dot" + (token() ? "" : " gray");
  try {
    const r = await fetch("./content.json?" + Date.now());
    C = await r.json();
  } catch (e) { toast("Не удалось загрузить content.json", "err"); C = {} }
  render();
})();
</script>
